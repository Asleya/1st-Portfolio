name: Déploiement du portfolio

on: #Choisir la branche
  push:
    branches: [main]      
  workflow_dispatch:      

permissions:  #Autorisation deploiement github
  contents: read
  pages: write
  id-token: write

concurrency:  #Eviter les deploiement en même temps
  group: pages
  cancel-in-progress: true

jobs: #Action de configuration
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer le site
        run: |
          mkdir _site
          cp home-page.html _site/index.html
          cp home-page.css _site/
          if [ -d images ]; then cp -r images _site/; fi

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy: #Déploiement final
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4